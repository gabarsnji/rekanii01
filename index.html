<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پڕۆژێ من</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0d1117;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 30px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        h1 {
            color: #58a6ff;
        }
        p {
            color: #8b949e;
            font-size: 18px;
        }
        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background-color: #238636;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>بخێربهێی بۆ پڕۆژێ من!</h1>
        <p>ئەڤە یەکەم ماڵپەڕێ منە ل سەر GitHub ڕاستەوخۆ ب ڕێکا موبایلێ دروستکری.</p>
        <a href="#" class="btn">دەستپێکرن</a>
    </div>

</body>
</html>
